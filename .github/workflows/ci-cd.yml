name: Build and Push Docker Image

on:
  push:
    branches: ["main"] # Triggers only on main branch push

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Linting
        run: |
          npm install
          npm run lint

      - name: Build Docker Image
        run: docker build -t my-react-app:${{ github.sha }} .

      - name: Build Success Message
        run: echo "Docker image built successfully for commit ${{ github.sha }}"
